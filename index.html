<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
</head>

<body>
    <div id="auth-container" class="auth-container">
        <header>
            <h1>Matrix</h1>
        </header>
        <div class="auth-tabs">
            <button id="tab-login" class="auth-tab active">SIGN IN</button>
            <button id="tab-signup" class="auth-tab">SIGN UP</button>
        </div>
        <div class="auth-forms">
            <form id="login-form">
                <input type="email" id="login-email" placeholder="EMAIL" required>
                <input type="password" id="login-password" placeholder="PASSWORD" required>
                <button type="submit">LOG IN</button>
            </form>
            <form id="signup-form" class="hidden">
                <input type="email" id="signup-email" placeholder="EMAIL" required>
                <input type="password" id="signup-password" placeholder="PASSWORD" required>
                <button type="submit">SIGN UP</button>
            </form>
        </div>
    </div>

    <div id="main-app" class="app-container" style="display: none;">
        <div class="header-top-right">
            <div class="status-bar">
                <span id="sync-status" class="connecting">offline</span> | <span id="user-email"
                    class="user-email"></span>
                <button id="logout-btn" class="logout-btn" title="Logout">⏻</button>
            </div>
        </div>

        <div class="matrix-container">
            <div class="axis-label vertical-top">Urgent</div>
            <div class="axis-label vertical-bottom">Not urgent</div>
            <div class="axis-label horizontal-left">Important</div>
            <div class="axis-label horizontal-right">Not important</div>

            <main class="matrix-grid">
                <div class="quadrant urgent-important" data-id="urgent_important">
                    <h2>Do now</h2>
                    <div class="task-list"></div>
                </div>
                <div class="quadrant not-urgent-important" data-id="not_urgent_important">
                    <h2>Schedule</h2>
                    <div class="task-list"></div>
                </div>
                <div class="quadrant urgent-not-important" data-id="urgent_not_important">
                    <h2>Delegate</h2>
                    <div class="task-list"></div>
                </div>
                <div class="quadrant not-urgent-not-important" data-id="not_urgent_not_important">
                    <h2 class="delete-header">Delete</h2>
                    <div class="task-list"></div>
                </div>
            </main>
        </div>

        <button id="fab-add-task" class="fab">+</button>

        <div id="new-task-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>New task</h2>
                </div>
                <form id="modal-task-form">
                    <input type="text" id="modal-task-title" placeholder="" required autocomplete="off">
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>

</html>
